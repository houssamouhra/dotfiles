general {
    lock_cmd = pidof hyprlock || ~/.config/hypr/scripts/lock.sh
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
    ignore_dbus_inhibit = spotify
}

listener {
    timeout = 180
    on-timeout = notify-send -u low "Idle" "Locking in 2 minutes!"
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 600
    on-timeout = sh -c '[ ! $(pidof spotify) ] && hyprctl dispatch dpms off || true'
    on-resume = hyprctl dispatch dpms on
}
