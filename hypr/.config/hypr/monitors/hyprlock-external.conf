# Hyprlock config for my external monitor

source = $HOME/.cache/wal/colors-hyprland

# General
general {
    hide_cursor = true
    grace = 0
}

# Animations
animations {
    enabled = true
    bezier = overshot, 0.13, 0.99, 0.29, 1.1
    animation = fadeOut, 1, 10, overshot
}

# Background
background {
    monitor =
    path = $wallpaper
    blur_size = 3
    blur_passes = 3
    brightness = .6
    vibrancy = 0.15
}

# Password Field
input-field {
    monitor =
    size = 6%, 4%
    position = 0, 40
    halign = center
    valign = center
    rounding = 20
    outline_thickness = 0
    inner_color = $backgroundCol
    outer_color = $backgroundCol
    check_color= $backgroundCol
    fail_color= $backgroundCol
    font_color = $color9
    dots_rounding = 4
    dots_spacing = .5
    dots_fade_time = 300

    fade_on_empty = false
    font_family = JetBrains Mono
    placeholder_text = <i></i>
    fail_text = <b>FAIL</b>
    fail_timeout = 300
    shadow_color = rgba(0,0,0,0.45)
    shadow_passes = 2
    shadow_size = 2
}

# Hour
label {
    monitor =
    text = cmd[update:1000] date +"<b>%I</b>"
    color = $color9
    font_size = 100
    font_family = JetBrains Mono
    position = 0, 350
    shadow_passes = 0
    shadow_size = 5
    shadow_color = rgba(0,0,0,0.5)
    valign = center
}

# Minute
label {
    monitor =
    text = cmd[update:1000] date +"<b>%M</b>"
    color = $color8
    font_size = 100
    font_family = JetBrains Mono
    position = 0, 220
    shadow_passes = 0
    shadow_size = 5
    shadow_color = rgba(0,0,0,0.5)
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:1000] date +"<b>%A, %B %d, %Y</b>"
    color = $color4
    font_size = 20
    font_family = JetBrains Mono
    shadow_passes = 0
    shadow_size = 4
    position = -20,-5
    halign = right
    valign = top
}

# Greeting
label {
    monitor =
    text = <i>Hello</i> <b>$USER</b>
    color = $color5
    font_size = 20
    font_family = JetBrains Mono
    shadow_passes = 0
    shadow_size = 4
    position = 20,-5
    halign = left
    valign = top
}
