input {
    kb_layout = us
    repeat_delay = 300
    repeat_rate = 50

    follow_mouse = 1
    accel_profile = flat
    sensitivity = 0.0

    touchpad {
        natural_scroll = true
    }
}

gestures {
    workspace_swipe_distance = 300
    workspace_swipe_cancel_ratio = .05
    workspace_swipe_min_speed_to_force = 0
}

device {
    name = pixart-hp-usb-optical-mouse
    sensitivity = 0
}
