include=/home/houssam/.cache/wal/fuzzel.ini

[main]
font=Maple Mono NF:size=8
terminal=foot
placeholder="Search apps"

# Layout
lines=4
width=27
horizontal-pad=15
vertical-pad=10
line-height=17
inner-pad=6

[border]
width=0
radius=20
selection-radius=14

[key-bindings]
delete-line-forward=none
cursor-left=Control+h
cursor-right=Control+l
next=Control+j
prev=Control+k
