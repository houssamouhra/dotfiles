[main]
font=Maple Mono NF:size=12
terminal=foot -e
placeholder="Search apps"
prompt="➜ "
dpi-aware=no

# Layout
lines=4
width=27
horizontal-pad=19
vertical-pad=12
line-height=24
inner-pad=7

[border]
width=0
radius=0
selection-radius=0

[key-bindings]
delete-line-forward=none
next=Control+j
prev=Control+k

[colors]
background=#1a1b26ee
text=#c0caf5ff
prompt=#bb9af7ff
placeholder=#565f89ff
input=#c0caf5ff
match=#7aa2f7ff
selection=#33467cff
selection-text=#c0caf5ff
selection-match=#7dcfffff
border=#7aa2f7ff
