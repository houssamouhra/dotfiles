# Display style of current position.
timeline_style=line

# Timeline line width.
timeline_line_width=2

# Timeline size when fully expanded.
timeline_size=25

# States when the timeline should remain fully visible.
timeline_persistency=

# Top border separating the timeline from the video.
timeline_border=1

# Seek amount when scrolling above the timeline.
timeline_step=5

# Render cache indicators.
timeline_cache=yes

# Render YouTube heatmap.
timeline_heatmap=overlay

# Display progress bar in windowed mode.
progress=windowed
progress_size=2
progress_line_width=20

# Controls displayed above the timeline.
controls=menu,gap,<video,audio>subtitles,<has_many_audio>audio,<has_many_video>video,<has_many_edition>editions,<stream>stream-quality,gap,space,<video,audio>speed,space,shuffle,loop-playlist,loop-file,gap,prev,items,next,gap,fullscreen
controls_size=32
controls_margin=8
controls_spacing=2
controls_persistency=

# Position of volume controls.
volume=right
volume_size=40
volume_border=1
volume_step=1
volume_persistency=

# Playback speed adjustment step.
speed_step=0.1
speed_step_is_factor=no
speed_persistency=

# Menu item height.
menu_item_height=36

# Minimum menu width.
menu_min_width=260

# Menu padding.
menu_padding=4

# Require a search key before typing in menus.
menu_type_to_search=yes

# Top bar style.
top_bar=no-border
top_bar_size=40

# Top bar window controls.
top_bar_controls=no

# Display the media title in the top bar.
top_bar_title=yes
top_bar_alt_title=

# Position of the alternative title.
top_bar_alt_title_place=below

# File types that flash the top bar.
top_bar_flash_on=video,audio
top_bar_persistency=

# Window border size in no-border mode.
window_border_size=1

# Automatically load the next file when playback ends.
autoload=no

# Shuffle playlist/directory items.
shuffle=no

# UI scale.
scale=1

# UI scale in fullscreen.
scale_fullscreen=1

# Text scaling.
font_scale=1

# Border around text and icons.
text_border=1.2

# Border radius of UI elements.
border_radius=4

# UI colors.
foreground     = #c0caf5
foreground_text= #1a1b26
background     = #1a1b26
background_text= #c0caf5
curtain        = #16161e
success        = #9ece6a
error          = #f7768e
match          = #7aa2f7

# UI element opacity.
opacity=timeline=0.8,speed=0,menu=0.84,title=0,tooltip=0.8,curtain=0.2,playlist_position=0.15

# Performance-related refinements.
refine=

# Animation duration.
animation_duration=100

# Flash duration.
flash_duration=1000

# Distance for UI fade-in.
proximity_in=40

# Distance for UI fade-out.
proximity_out=120

# Use bold font throughout the UI.
font_bold=no

# Time display mode.
destination_time=playtime-remaining

# Timestamp precision.
time_precision=0

# Buffered time threshold.
buffered_time_threshold=60

# Hide UI when the cursor autohides.
autohide=no

# Pause indicator style.
pause_indicator=flash

# Stream quality options.
stream_quality_options=4320,2160,1440,1080,720,480,360,240,144

# Supported video file types.
video_types=3g2,3gp,asf,avi,f4v,flv,h264,h265,m2ts,m4v,mkv,mov,mp4,mp4v,mpeg,mpg,ogm,ogv,rm,rmvb,ts,vob,webm,wmv,y4m

# Supported audio file types.
audio_types=aac,ac3,aiff,ape,au,cue,dsf,dts,flac,m4a,mid,midi,mka,mp3,mp4a,oga,ogg,opus,spx,tak,tta,wav,weba,wma,wv

# Supported image file types.
image_types=apng,avif,bmp,gif,j2k,jp2,jfif,jpeg,jpg,jxl,mj2,png,svg,tga,tif,tiff,webp

# Supported subtitle file types.
subtitle_types=aqt,ass,gsub,idx,jss,lrc,mks,pgs,pjs,psb,rt,sbv,slt,smi,sub,sup,srt,ssa,ssf,ttxt,txt,usf,vt,vtt

# Supported playlist file types.
playlist_types=m3u,m3u8,pls,url,cue

# File type pools used for navigation and autoload.
load_types=video,audio,image

# Default directory for the open-file menu.
default_directory=~/

# Show hidden files.
show_hidden_files=no

# Move deleted files to the trash.
use_trash=no

# Adjust OSD margins based on visible UI elements.
adjust_osd_margins=yes

# Display chapter range indicators.
chapter_ranges=openings:bb9af7,endings:bb9af7,ads:f7768e80

# Patterns used to identify chapter ranges.
chapter_range_patterns=openings:オープニング;endings:エンディング

# Subtitle language priority.
languages=slang,en

# Directory for downloaded subtitles.
subtitles_directory=~~/subtitles

# UI elements to disable.
disable_elements=
