[opener]
edit = [
  { run = 'nvim "$@"', block = true, for = "unix" },
]

open = [
  { run = 'xdg-open "$@"', desc = "System default", for = "linux" },
]

video = [
  { run = 'vlc "$@"', desc = "VLC" }
]

pdf = [
  { run = 'zathura "$@"', desc = "Zathura", orphan = true }
]

imgs = [
  { run = 'feh "$@"', desc = "Feh", orphan = true }
]
]

[open]
rules = [
  { mime = "audio/*", use = "open" },
  { mime = "video/*", use = "video" },
  { mime = "application/pdf", use = "pdf" },
  { mime = "image/*", use = "imgs" },

  # Everything else → Neovim
  { name = "*", use = "edit" }
]

