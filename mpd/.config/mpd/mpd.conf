# Music directory
music_directory         "~/Music"
playlist_directory      "~/Music/Playlists"
auto_update             "yes"

# Allow both local socket + TCP
bind_to_address         "~/.config/mpd/socket"
bind_to_address         "127.0.0.1"

restore_paused          "yes"
max_output_buffer_size  "16384"

audio_output {
    type "pulse"
    name "pulse"
}
